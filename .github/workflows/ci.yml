name: Build and Push to ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: hms-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hms_backend

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT
        id: build

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_HOST,DB_USER,DB_PASSWORD,DB_NAME
          script: |
            set -e
            ENV_FILE=/home/ec2-user/.env
            touch "$ENV_FILE"
            grep -vE '^DB_(HOST|USER|PASSWORD|NAME)=' "$ENV_FILE" > /tmp/.env.trimmed || true
            mv /tmp/.env.trimmed "$ENV_FILE"
            printf '%s\n' "DB_HOST=$DB_HOST" >>"$ENV_FILE"
            printf '%s\n' "DB_USER=$DB_USER" >>"$ENV_FILE"
            printf '%s\n' "DB_PASSWORD=$DB_PASSWORD" >>"$ENV_FILE"
            printf '%s\n' "DB_NAME=$DB_NAME" >>"$ENV_FILE"
            chmod 600 "$ENV_FILE"

            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 070648356305.dkr.ecr.eu-north-1.amazonaws.com

            docker stop hms-backend || true
            docker rm hms-backend || true

            docker pull 070648356305.dkr.ecr.eu-north-1.amazonaws.com/hms-backend:latest

            docker run -d \
              --name hms-backend \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file "$ENV_FILE" \
              070648356305.dkr.ecr.eu-north-1.amazonaws.com/hms-backend:latest

            echo "Deployment complete!"
            docker ps
