version: "3.8"

services:
  hms-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=${mydb.c1ika0ww88jp.eu-north-1.rds.amazonaws.com}
      - DB_USER=${admin}
      - DB_PASSWORD=${Helloworld*2026}
      - DB_NAME=${hms}
      - JWT_SECRET=${Helloworld_17jan_2026_to_Helloworld_17jan_2022}
      - SESSION_SECRET=${Helloworld_17jan_2026_to_Helloworld_17jan_2022}
      - FRONTEND_URL=${http://localhost:3000}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hms-network

networks:
  hms-network:
    driver: bridge
